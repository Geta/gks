name: Add Helm Repo
inputs:
  alias:
    required: true
    type: string
    description: 'Helm repository alias'
  user:
    required: true
    type: string
    description: 'Helm repository user'
  token:
    required: true
    type: string
    description: 'Helm repository token'
  url:
    required: true
    type: string
    description: 'Helm repository url'
runs:
  using: "composite"
  steps:
    -
      name: Add Helm repository
      id: repo
      shell: bash
      env:
        HELM_ALIAS: ${{ inputs.alias }}
        HELM_URL: ${{ inputs.url }}
        HELM_USER: ${{ inputs.user }}
        HELM_TOKEN: ${{ inputs.token }}
      run: |
        printf '%s' "$HELM_TOKEN" | helm repo add --username "$HELM_USER" --password-stdin "$HELM_ALIAS" "$HELM_URL"
        if [[ "$HELM_URL" == */chartrepo/* ]]; then
          REGISTRY=$(printf '%s' "$HELM_URL" | sed -E 's#^https?://([^/]+)/.*#\1#')
          printf '%s' "$HELM_TOKEN" | helm registry login "$REGISTRY" --username "$HELM_USER" --password-stdin
        fi
        echo "alias=$HELM_ALIAS" >> $GITHUB_OUTPUT
    - 
      name: Update HELM repository
      shell: bash
      run: helm repo update ${{ steps.repo.outputs.alias }}